# Furtalk backend static configuration template (YAML).
# Copy to configs/config.yaml or set the equivalent FURTALK_* environment variables.
# Priority: non-empty environment variables > this file > built-in defaults.
# The file schema mirrors the nested Config sections. Unknown keys fail startup.
#
# 配置级别（必需 / 推荐 / 可选）


# [必需] 注意：WebAuthn RP 与 JWT issuer 都必须显式提供，不再从此值派生。
http:
  address: ":8080"
  public_base_url: "https://furtalk.example.com"
  # [推荐] 可信代理 CIDR 列表。
  # 仅当直接对端位于这些 CIDR 内时才解析 X-Forwarded-For 可信代理链：
  # 从最右一跳向左跳过可信地址，选择第一个非可信地址作为客户端 IP；
  # trusted_proxies:
  #   - "10.0.0.0/8"
  #   - "192.168.0.0/16"
  # [推荐] 关闭超时。
  # shutdown_timeout: "10s"
  # [推荐] HTTP 读头超时。
  # read_header_timeout: "5s"
  # [推荐] HTTP 读超时。
  # read_timeout: "15s"
  # [推荐] HTTP 写超时。
  # write_timeout: "60s"
  # [推荐] HTTP 空闲连接超时。
  # idle_timeout: "60s"
  # [推荐] HTTP 请求头上限（字节）。
  # max_header_bytes: 65536
  # [推荐] 请求体上限（字节）。
  # body_limit: 1048576
  # [推荐] 限流速率（每秒请求数）。
  # rate_limit_rate: 10
  # [推荐] 限流突发容量。
  # rate_limit_burst: 100

database:
  # [必需] 数据库选择。
  # sqlite or postgres。
  dialect: sqlite
  # [SQLite 必需] 文件路径或 SQLite file URI。
  path: "/app/data/furtalk.db"
  # [PostgreSQL 必需] 未选择 postgres 时以下字段会被忽略。
  # host: "db.example.com"
  # port: 5432
  # name: "furtalk"
  # user: "furtalk"
  # password: "replace-me"
  # ssl_mode: "require"

cache:
  # [可选] 空值选择进程内存缓存
  # redis_url: "redis://user:pass@redis.example.com:6379/0"

tokens:
  # [必需] JWT 签发。
  jwt_issuer: "https://furtalk.example.com"
  # [推荐] 固定 HS256。
  # jwt_algorithm: HS256
  # [必需] JWT 签发，请替换为随机密钥。
  jwt_key: "replace-me"
  # [推荐] 第一方 JWT 有效期。
  # jwt_lifetime: "168h"
  # [推荐] 内嵌组件 JWT 有效期。
  # widget_jwt_lifetime: "24h"
  # [必需] 加密数据库存储的密钥，请替换为随机密钥。
  secret_key: "replace-me"

webauthn:
  # [必需] WebAuthn
  rp_id: "furtalk.example.com"
  # [必需] WebAuthn
  rp_origins:
    - "https://furtalk.example.com"
  # [推荐] WebAuthn RP 展示名。
  # rp_name: "Furtalk"

oauth:
  # [推荐] OAuth HTTP 超时。
  # client_timeout: "10s"  # 必须大于 0 且不超过 60s。

# [默认] 后端日志输出格式：json 或 text。
logging:
  # format: "text"

smtp:
  # [可选] host 为空时将不会投递邮件。
  # host: "smtp.example.com"
  # [推荐] 仅当 host 设置后生效，取值 1-65535。
  # port: 587
  # [必需，启用 SMTP 时] from 需为合法邮箱地址。
  # from: "noreply@example.com"
  # [推荐] 仅当 host 设置后生效，取值 starttls | tls | none。
  # tls: "starttls"
  # [可选] 凭据。
  # username: "user"
  # password: "secret"
  # [推荐] 仅当 host 设置后生效。
  # timeout: "30s"
