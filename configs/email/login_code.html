<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>您的 Furtalk 登录验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f7fb;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="background-color:#ffffff;border-radius:16px;padding:36px 32px;">
              <p style="margin:0 0 32px;font-size:17px;line-height:1;font-weight:700;letter-spacing:-0.2px;color:#2563eb;">Furtalk</p>
              <h1 style="margin:0 0 16px;font-size:24px;line-height:1.35;letter-spacing:-0.4px;color:#111827;">您的登录验证码</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#4b5563;line-height:1.7;">请使用下方验证码完成登录，验证码将在 {{.ExpiresInMinutes}} 分钟后过期。</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eef4ff;border-radius:12px;margin:0 0 24px;">
                <tr>
                  <td align="center" style="padding:21px 12px 23px;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:12px;color:#1d4ed8;padding-left:24px;">{{.Code}}</td>
                </tr>
              </table>
              <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.7;">如非本人操作，请忽略此邮件，验证码将自动失效。</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
