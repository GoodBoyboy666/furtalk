<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light">
  <title>您有一条新回复</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;width:100%;margin:0;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 4px 16px rgba(15,23,42,0.04);overflow:hidden;">
          <tr>
            <td style="height:4px;background-color:#2563eb;"></td>
          </tr>
          <tr>
            <td style="padding:36px 32px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px;">
                <tr>
                  <td align="left" style="vertical-align:middle;">
                    <span style="font-size:20px;font-weight:800;letter-spacing:-0.4px;color:#2563eb;">Furtalk</span>
                  </td>
                  <td align="right" style="vertical-align:middle;">
                    <span style="display:inline-block;background-color:#eff6ff;color:#2563eb;border:1px solid #dbeafe;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;line-height:1;">新回复</span>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-0.3px;color:#0f172a;">您有一条新回复</h1>
              <p style="margin:0 0 20px;font-size:15px;color:#475569;line-height:1.65;"><strong style="color:#0f172a;">{{.ReplyAuthorNickname}}</strong> 回复了您的评论：</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;background-color:#f0f7ff;border:1px solid #bfdbfe;border-left:4px solid #2563eb;border-radius:10px;">
                <tr>
                  <td style="padding:18px 20px;font-size:15px;color:#1e293b;line-height:1.7;white-space:pre-wrap;word-break:break-word;">{{.ReplyBody}}</td>
                </tr>
              </table>

              {{if .ParentCommentBody}}
              <p style="margin:0 0 8px;font-size:13px;font-weight:600;color:#64748b;">您的评论：</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px;background-color:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid #94a3b8;border-radius:10px;">
                <tr>
                  <td style="padding:14px 18px;font-size:13px;color:#475569;line-height:1.7;white-space:pre-wrap;word-break:break-word;">{{.ParentCommentBody}}</td>
                </tr>
              </table>
              {{end}}

              {{if .UnsubscribeURL}}
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;margin:0 0 28px;">
                <tr>
                  <td style="padding:12px 16px;font-size:13px;color:#64748b;line-height:1.6;">
                    如不再想收到此类邮件，可 <a href="{{.UnsubscribeURL}}" style="color:#2563eb;text-decoration:none;font-weight:600;">点击此处退订</a>。
                  </td>
                </tr>
              </table>
              {{end}}

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e2e8f0;margin:0 0 20px;"><tr><td></td></tr></table>

              <p style="margin:0 0 6px;font-size:12px;color:#94a3b8;line-height:1.5;text-align:center;">此邮件由系统自动发送，请勿直接回复。</p>
              <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.5;text-align:center;">© Furtalk · 简洁现代的开源评论系统</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
