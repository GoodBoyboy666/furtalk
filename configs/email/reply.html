<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>您有一条新回复</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f6f7fb;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
          <tr>
            <td style="background-color:#ffffff;border-radius:16px;padding:36px 32px;">
              <p style="margin:0 0 32px;font-size:17px;line-height:1;font-weight:700;letter-spacing:-0.2px;color:#2563eb;">Furtalk</p>
              <h1 style="margin:0 0 16px;font-size:24px;line-height:1.35;letter-spacing:-0.4px;color:#111827;">您有一条新回复</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#4b5563;line-height:1.7;">{{.ReplyAuthorNickname}} 回复了您的评论：</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;background-color:#f5f7fb;border-radius:10px;">
                <tr>
                  <td style="padding:18px 20px;font-size:15px;color:#1f2937;line-height:1.7;white-space:pre-wrap;">{{.ReplyBody}}</td>
                </tr>
              </table>
              {{if .ParentCommentBody}}
              <p style="margin:0 0 10px;font-size:13px;color:#6b7280;">您的评论：</p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px;background-color:#f8fafc;border-radius:10px;">
                <tr>
                  <td style="padding:16px 20px;font-size:13px;color:#4b5563;line-height:1.7;white-space:pre-wrap;">{{.ParentCommentBody}}</td>
                </tr>
              </table>
              {{end}}
              {{if .UnsubscribeURL}}
              <p style="margin:0;font-size:13px;color:#6b7280;line-height:1.7;">如不再想收到此类邮件，可<a href="{{.UnsubscribeURL}}" style="color:#2563eb;text-decoration:none;font-weight:600;">点击此处退订</a>。</p>
              {{end}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
