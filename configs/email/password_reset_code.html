<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="color-scheme" content="light">
  <title>您的 Furtalk 密码重置验证码</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f1f5f9;width:100%;margin:0;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;background-color:#ffffff;border-radius:16px;border:1px solid #e2e8f0;box-shadow:0 4px 16px rgba(15,23,42,0.04);overflow:hidden;">
          <tr>
            <td style="height:4px;background-color:#2563eb;"></td>
          </tr>
          <tr>
            <td style="padding:36px 32px 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:28px;">
                <tr>
                  <td align="left" style="vertical-align:middle;">
                    <span style="font-size:20px;font-weight:800;letter-spacing:-0.4px;color:#2563eb;">Furtalk</span>
                  </td>
                  <td align="right" style="vertical-align:middle;">
                    <span style="display:inline-block;background-color:#eff6ff;color:#2563eb;border:1px solid #dbeafe;padding:4px 10px;border-radius:9999px;font-size:12px;font-weight:600;line-height:1;">密码重置</span>
                  </td>
                </tr>
              </table>

              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.35;font-weight:700;letter-spacing:-0.3px;color:#0f172a;">重置您的密码</h1>
              <p style="margin:0 0 24px;font-size:15px;color:#475569;line-height:1.65;">我们收到了您重置密码的请求。请使用下方验证码完成密码重置，验证码将在 <strong>{{.ExpiresInMinutes}} 分钟</strong> 后失效。</p>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f0f7ff;border:1.5px dashed #bfdbfe;border-radius:12px;margin:0 0 24px;">
                <tr>
                  <td align="center" style="padding:24px 16px 20px;">
                    <div style="font-size:36px;line-height:1.1;font-weight:800;letter-spacing:10px;color:#1d4ed8;font-family:'SF Mono',Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;padding-left:10px;">{{.Code}}</div>
                    <div style="margin-top:10px;font-size:12px;color:#3b82f6;font-weight:500;">⏱️ 有效期 {{.ExpiresInMinutes}} 分钟</div>
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#fffbeb;border:1px solid #fef3c7;border-radius:10px;margin:0 0 28px;">
                <tr>
                  <td style="padding:12px 16px;font-size:13px;color:#92400e;line-height:1.6;">
                    ⚠️ <strong>安全提示</strong>：如果您未发起此操作，请勿将验证码透露给任何人并忽略此邮件，您的账户依然安全。
                  </td>
                </tr>
              </table>

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e2e8f0;margin:0 0 20px;"><tr><td></td></tr></table>

              <p style="margin:0 0 6px;font-size:12px;color:#94a3b8;line-height:1.5;text-align:center;">此邮件由系统自动发送，请勿直接回复。</p>
              <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.5;text-align:center;">© Furtalk · 简洁现代的开源评论系统</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
