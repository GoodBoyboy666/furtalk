name: GHCR image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository without submodules
        uses: actions/checkout@v4
        with:
          submodules: false

      # Keep this gate before Web submodule initialization, registry login, and
      # the multi-platform build so a broad tag match has no release side effect.
      - name: Validate release tag
        id: tag
        shell: bash
        run: |
          ./scripts/release-tag.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-tag.env"
          cat "$RUNNER_TEMP/release-tag.env"
          cat "$RUNNER_TEMP/release-tag.env" >> "$GITHUB_OUTPUT"

      - name: Initialize Web submodule only
        run: git submodule update --init --depth 1 web

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/furtalk" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }}
            type=raw,value=latest,enable=${{ steps.tag.outputs.prerelease == 'false' }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max,ignore-error=true
