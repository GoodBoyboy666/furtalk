info:
  contact: {}
  description: |-
    Furtalk 评论系统的 HTTP API：覆盖站点与管理员引导、
    第一方与 widget 认证/会话、评论发布与审核、站点/用户/设置/
    提供商管理与邮件通知退订。
  title: Furtalk API
  version: 1.0.0
paths:
  /api/v1/admin/comments:
    get:
      parameters:
      - description: 站点 ID（十进制字符串）
        in: query
        name: site_id
        type: integer
      - description: 线程 ID（十进制字符串）
        in: query
        name: thread_id
        type: integer
      - description: pending | published | spam | deleted
        in: query
        name: status
        type: string
      - description: 作者用户 ID（十进制字符串）
        in: query
        name: user_id
        type: integer
      - description: 正文/作者邮箱/昵称搜索关键字
        in: query
        name: q
        type: string
      - description: RFC3339 时间下限
        in: query
        name: since
        type: string
      - description: RFC3339 时间上限
        in: query
        name: until
        type: string
      - description: 排序方向：asc（最早优先）或 desc（最新优先，默认）
        in: query
        name: sort
        type: string
      - description: 页码（从 1 开始，默认 1）
        in: query
        name: page
        type: integer
      - description: 每页数量（默认 25）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 一页评论与匹配总数
          schema:
            $ref: '#/definitions/internal_handler.AdminCommentListResponse'
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "401":
          description: 需要管理员登录
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
      summary: 使用过滤器与页码分页列出评论
      tags:
      - admin-comments
  /api/v1/admin/comments/{comment_id}:
    delete:
      parameters:
      - description: 评论 ID（十进制字符串）
        in: path
        name: comment_id
        required: true
        type: integer
      - description: 是否物理删除
        in: query
        name: hard
        type: boolean
      - description: 硬删除需要显式确认
        in: query
        name: confirm
        type: boolean
      - description: CSRF token
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除结果
          schema:
            $ref: '#/definitions/internal_handler.CommentDeleteResponse'
        "400":
          description: 请求参数无效
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "401":
          description: 需要管理员登录
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "404":
          description: 评论不存在
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "409":
          description: 评论状态冲突
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
        "422":
          description: 破坏性操作需要显式确认
          schema:
            $ref: '#/definitions/furtalk_internal_platform_httpx.ErrorResponse'
      summary: 删除评论（软删除或硬删除）
      tags:
      - admin-comments
    get:
      parameters:
      - description: 评论 ID（十进制字符串）
        in: path
        name: comment_id
        required: true
        type: integer
